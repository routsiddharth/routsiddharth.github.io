name: Sync Letterboxd films

# Scrapes the five-stars list nightly and commits any change to films.json / posters.
# The site reads the committed JSON, so a failed run leaves the last good data serving.

on:
  schedule:
    - cron: '17 6 * * *'      # 06:17 UTC daily
  workflow_dispatch:           # and on demand, right after you edit the list

permissions:
  contents: write

concurrency:
  group: sync-films
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync from Letterboxd + TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/sync_films.py

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain assets/data/films.json assets/images/films)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/films.json assets/images/films
            git commit -m "Sync five-star films from Letterboxd"
            git push
          else
            echo "No change."
          fi
